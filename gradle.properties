# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon.
# Keep the heap conservative: this machine has 8 GB of RAM.
# Machine-specific settings (JDK path, Android SDK path) belong in
# ~/.gradle/gradle.properties or local.properties, not in this file.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# The Kotlin compiler daemon needs a bigger heap than the Gradle daemon:
# at -Xmx1280m, :core:compileKotlinJvm (542 files) dies with
# "GC overhead limit exceeded". Close VS Code / other apps before building
# so this heap has room on the 8 GB machine.
kotlin.daemon.jvmargs=-Xmx2560m

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
