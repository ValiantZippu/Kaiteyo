<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- DMG background artwork (660x400). Left panel = brand, right panel = drop zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <circle cx="330" cy="200" r="250" fill="url(#glow)"/>

  <!-- Mark -->
  <rect x="86" y="128" width="96" height="96" rx="24" fill="#ffffff"/>
  <path d="M112 152 h20 v30 l22 -30 h19 l-25 34 25 32 h-20 l-21 -28 v28 h-20 Z" fill="#312e81"/>

  <!-- Wordmark -->
  <text x="134" y="268" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="34" font-weight="bold" fill="#ffffff">Kaiteyo</text>
  <text x="134" y="292" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" fill="#c7d2fe">書いてよ — Learn Japanese, beautifully</text>
  <text x="134" y="322" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="12" fill="#818cf8">v2.2.1 · macOS</text>

  <!-- Drop zone hint -->
  <g transform="translate(430,128)">
    <rect x="0" y="0" width="150" height="96" rx="20" fill="#ffffff" fill-opacity="0.06"
          stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="75" y="52" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="15" fill="#e0e7ff">Drag to Applications</text>
    <text x="75" y="74" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="10" fill="#a5b4fc">to install</text>
  </g>
</svg>
