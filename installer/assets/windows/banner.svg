<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <!-- Inno Setup modern wizard banner (WizardImageFile). 164x314 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="164" height="314" fill="url(#bg)"/>
  <g opacity="0.18">
    <circle cx="8" cy="60" r="90" fill="#ffffff"/>
    <circle cx="180" cy="280" r="120" fill="#ffffff"/>
  </g>
  <!-- Mark -->
  <rect x="52" y="64" width="60" height="60" rx="16" fill="#ffffff"/>
  <path d="M67 78 h10 v18 l14 -18 h12 l-16 20 16 22 h-13 l-13 -18 v18 H67 Z" fill="#312e81"/>
  <!-- Wordmark -->
  <text x="82" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
