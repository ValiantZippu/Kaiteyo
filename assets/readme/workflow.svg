<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="wfGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#wfBg)" rx="16"/>
  <rect x="0" y="0" width="1200" height="1" fill="#2A2A2A" rx="16"/>

  <!-- Section title -->
  <text x="60" y="40" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#C2FC8B">▸ How Kaiteyo works</text>

  <!-- Step 1: Read -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="220" height="180" rx="12" fill="#101010" stroke="#2A2A2A" stroke-width="1"/>
    <text x="20" y="35" font-size="24">📖</text>
    <text x="50" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#F0F0F0">Read or Watch</text>
    <text x="20" y="65" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">Japanese content in the</text>
    <text x="20" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">built-in browser, media</text>
    <text x="20" y="99" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">player, or reading env.</text>
    <rect x="20" y="120" width="80" height="24" rx="6" fill="#0D0D0D" stroke="#1E1E1E" stroke-width="1"/>
    <text x="60" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#606060">Browser</text>
    <rect x="110" y="120" width="70" height="24" rx="6" fill="#0D0D0D" stroke="#1E1E1E" stroke-width="1"/>
    <text x="145" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#606060">Media</text>
    <rect x="12" y="155" width="196" height="1" fill="#1E1E1E" opacity="0.5"/>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(310, 155)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#C2FC8B" stroke-width="2" opacity="0.5"/>
    <polygon points="50,-5 60,0 50,5" fill="#C2FC8B" opacity="0.5"/>
  </g>

  <!-- Step 2: Hover -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="220" height="180" rx="12" fill="#101010" stroke="#2A2A2A" stroke-width="1"/>
    <text x="20" y="35" font-size="24">🔍</text>
    <text x="50" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#F0F0F0">Hover a Word</text>
    <text x="20" y="65" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">Instant dictionary popup</text>
    <text x="20" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">with readings, definitions,</text>
    <text x="20" y="99" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">and TTS pronunciation.</text>
    <rect x="20" y="120" width="60" height="24" rx="6" fill="#C2FC8B" fill-opacity="0.15" stroke="#C2FC8B" stroke-width="1" stroke-opacity="0.3"/>
    <text x="50" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#C2FC8B">Yomitan</text>
    <rect x="90" y="120" width="55" height="24" rx="6" fill="#0D0D0D" stroke="#1E1E1E" stroke-width="1"/>
    <text x="117" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#606060">JMdict</text>
    <rect x="12" y="155" width="196" height="1" fill="#1E1E1E" opacity="0.5"/>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(610, 155)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#FEAB57" stroke-width="2" opacity="0.5"/>
    <polygon points="50,-5 60,0 50,5" fill="#FEAB57" opacity="0.5"/>
  </g>

  <!-- Step 3: Mine -->
  <g transform="translate(680, 80)">
    <rect x="0" y="0" width="220" height="180" rx="12" fill="#101010" stroke="#2A2A2A" stroke-width="1"/>
    <text x="20" y="35" font-size="24">✂️</text>
    <text x="50" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#F0F0F0">Mine a Sentence</text>
    <text x="20" y="65" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">Card with screenshot,</text>
    <text x="20" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">audio clip, and timestamp</text>
    <text x="20" y="99" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">lands in your SRS queue.</text>
    <rect x="20" y="120" width="80" height="24" rx="6" fill="#FEAB57" fill-opacity="0.15" stroke="#FEAB57" stroke-width="1" stroke-opacity="0.3"/>
    <text x="60" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#FEAB57">Mining</text>
    <rect x="110" y="120" width="70" height="24" rx="6" fill="#0D0D0D" stroke="#1E1E1E" stroke-width="1"/>
    <text x="145" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#606060">Anki</text>
    <rect x="12" y="155" width="196" height="1" fill="#1E1E1E" opacity="0.5"/>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(910, 155)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#7BC8FF" stroke-width="2" opacity="0.5"/>
    <polygon points="50,-5 60,0 50,5" fill="#7BC8FF" opacity="0.5"/>
  </g>

  <!-- Step 4: Review -->
  <g transform="translate(980, 80)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="#101010" stroke="#2A2A2A" stroke-width="1"/>
    <text x="20" y="35" font-size="24">🧠</text>
    <text x="50" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#F0F0F0">Review</text>
    <text x="20" y="65" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">Spaced repetition with</text>
    <text x="20" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">FSRS-5. Jump back to the</text>
    <text x="20" y="99" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A0A0A0">exact scene in the media.</text>
    <rect x="20" y="120" width="70" height="24" rx="6" fill="#7BC8FF" fill-opacity="0.15" stroke="#7BC8FF" stroke-width="1" stroke-opacity="0.3"/>
    <text x="55" y="136" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7BC8FF">FSRS-5</text>
    <rect x="12" y="155" width="156" height="1" fill="#1E1E1E" opacity="0.5"/>
  </g>

  <!-- Bottom note -->
  <text x="600" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#606060">
    Everything works offline. Your data is yours — import, export, Anki, backup, sync.
  </text>
</svg>