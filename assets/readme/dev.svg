  <text x="160" y="79" font-family="JetBrains Mono, monospace" font-size="11" fill="#606060">terminal</text>

  <text x="80" y="118" font-family="JetBrains Mono, monospace" font-size="12" fill="#606060"># Requirements: JDK 17</text>
  <text x="80" y="138" font-family="JetBrains Mono, monospace" font-size="12" fill="#C2FC8B">$</text>
  <text x="96" y="138" font-family="JetBrains Mono, monospace" font-size="12" fill="#F0F0F0">git clone https://github.com/ValiantZippu/Kaiteyo.git</text>
  <text x="80" y="158" font-family="JetBrains Mono, monospace" font-size="12" fill="#C2FC8B">$</text>
  <text x="96" y="158" font-family="JetBrains Mono, monospace" font-size="12" fill="#F0F0F0">./gradlew :desktopApp:run</text>
  <text x="80" y="178" font-family="JetBrains Mono, monospace" font-size="12" fill="#C2FC8B">$</text>
  <text x="96" y="178" font-family="JetBrains Mono, monospace" font-size="12" fill="#F0F0F0">./gradlew :desktopApp:compileKotlinJvm</text>
  <text x="80" y="198" font-family="JetBrains Mono, monospace" font-size="12" fill="#C2FC8B">$</text>
  <text x="96" y="198" font-family="JetBrains Mono, monospace" font-size="12" fill="#F0F0F0">./gradlew :core:allTests</text>
  <text x="80" y="218" font-family="JetBrains Mono, monospace" font-size="12" fill="#C2FC8B">$</text>
  <text x="96" y="218" font-family="JetBrains Mono, monospace" font-size="12" fill="#F0F0F0">./gradlew :desktopApp:packageMsi</text>
  <text x="80" y="238" font-family="JetBrains Mono, monospace" font-size="11" fill="#606060"># First build downloads assets — network required</text>
