<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2FC8B"/>
      <stop offset="100%" stop-color="#9CE85E"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEAB57"/>
      <stop offset="100%" stop-color="#FD8A2E"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C2FC8B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C2FC8B" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="#050505"/>

  <!-- Subtle glow orb behind logo -->
  <ellipse cx="600" cy="140" rx="200" ry="120" fill="#C2FC8B" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Logo mark (simplified K calligraphy) -->
  <g transform="translate(560, 60)" filter="url(#glow)">
    <path d="M10,5 Q30,3 45,18 Q55,28 52,42 Q50,50 45,55"
          stroke="#C2FC8B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M15,28 Q35,22 50,32"
          stroke="#C2FC8B" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="52" cy="42" r="3" fill="#FEAB57"/>
  </g>

  <!-- Title -->
  <text x="600" y="160" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700"
        fill="#F0F0F0" letter-spacing="-0.02em">Kaiteyo</text>

  <!-- Japanese subtitle -->
  <text x="600" y="195" text-anchor="middle"
        font-family="Noto Sans JP, Hiragino Sans, sans-serif" font-size="20"
        fill="#606060" letter-spacing="0.08em">書いてよ</text>

  <!-- Tagline -->
  <text x="600" y="235" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="16"
        fill="#A0A0A0">Write it. Practice. Master it.</text>

  <!-- Subtitle -->
  <text x="600" y="258" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13"
        fill="#606060">A premium, cross-platform Japanese learning application</text>

  <!-- Badge row -->
  <g transform="translate(320, 290)">
    <!-- Version -->
    <rect x="0" y="0" width="95" height="26" rx="4" fill="#101010" stroke="#2A2A2A" stroke-width="1"/>
    <text x="48" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#C2FC8B">v2.2.1</text>

    <!-- License -->
    <rect x="105" y="0" width="95" height="26" rx="4" fill="#101010" stroke="#2A2A2A" stroke-width="1"/>
    <text x="152" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#FEAB57">GPL-3.0</text>

    <!-- Platforms -->
    <rect x="210" y="0" width="260" height="26" rx="4" fill="#101010" stroke="#2A2A2A" stroke-width="1"/>
    <text x="340" y="17" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#606060">Windows · macOS · Linux · Android · iOS</text>

    <!-- Kotlin -->
    <rect x="480" y="0" width="100" height="26" rx="4" fill="#101010" stroke="#7F52FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="530" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#7F52FF">Kotlin 2.1</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="418" width="1200" height="2" fill="url(#accentGrad)" opacity="0.3"/>
</svg>