[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiteyo-cli"
version = "0.1.0"
description = "Kaiteyo developer command center — git, gradle, wsl, doctor, docs, files and more"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.scripts]
kaiteyo = "kaiteyo_cli.app:main"

[tool.setuptools]
packages = ["kaiteyo_cli", "kaiteyo_cli.commands"]
