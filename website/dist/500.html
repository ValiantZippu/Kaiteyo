<!DOCTYPE html>
<html lang="en" data-base-path="/Kaiteyo/">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Something went wrong — Kaiteyo</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/Kaiteyo/assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/Kaiteyo/assets/styles/tokens.css" />
  <link rel="stylesheet" href="/Kaiteyo/assets/styles/themes.css" />
  <link rel="stylesheet" href="/Kaiteyo/assets/styles/base.css" />
  <link rel="stylesheet" href="/Kaiteyo/assets/styles/components.css" />
  <link rel="stylesheet" href="/Kaiteyo/assets/styles/utilities.css" />
  <script>
    (function () {
      try {
        var theme = JSON.parse(localStorage.getItem("kaiteyo:theme"));
        var root = document.documentElement;
        if (theme && theme.baseMode) {
          root.dataset.baseMode = theme.baseMode;
          root.dataset.accent = theme.accent || "signature";
          root.dataset.glass = theme.glass ? "true" : "false";
        } else {
          root.dataset.baseMode =
            window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "oled";
          root.dataset.accent = "signature";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main style="min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: var(--space-6)">
    <div style="text-align: center; max-width: 520px">
      <img src="/Kaiteyo/assets/images/kaiteyo-mark.svg" alt="" width="72" height="72"
           style="margin: 0 auto var(--space-6); border-radius: var(--radius-lg)" />
      <h1 style="font-size: var(--text-4xl); margin-bottom: var(--space-2)">500</h1>
      <p style="color: var(--text-secondary); margin-bottom: var(--space-8)">
        Something went wrong on our side. The page you asked for hit an error —
        try reloading, or head back to the dashboard.
      </p>
      <div class="flex-center gap-3">
        <a class="btn btn-primary" href="/Kaiteyo/">
          <svg class="icon" aria-hidden="true"><use href="#icon-dashboard"/></svg>
          Dashboard
        </a>
        <a class="btn btn-ghost" href="https://github.com/ValiantZippu/Kaiteyo/issues/new" target="_blank" rel="noopener">
          <svg class="icon" aria-hidden="true"><use href="#icon-chat"/></svg>
          Report an issue
        </a>
      </div>
    </div>
  </main>
</body>
</html>
