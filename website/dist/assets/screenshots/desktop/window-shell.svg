<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <!-- Backdrop -->
  <rect width="1200" height="800" fill="#0A0A0A"/>
  <!-- Desktop hint: faint second window behind -->
  <rect x="90" y="70" width="1080" height="720" rx="20" fill="#111111"/>
  <!-- Main window -->
  <rect x="60" y="40" width="1080" height="720" rx="20" fill="#161616" stroke="#2C2C2C" stroke-width="1"/>

  <!-- ================= TITLE BAR ================= -->
  <g>
    <!-- K logo (clickable; opens system menu) -->
    <rect x="76" y="52" width="20" height="20" rx="5" fill="#35402A"/>
    <text x="86" y="66" font-size="12" font-weight="bold" fill="#C2FC8B" text-anchor="middle">K</text>
    <!-- Wordmark (draggable) -->
    <text x="106" y="66" font-size="13" font-weight="500" fill="#E8E8E8">Kaiteyo</text>
    <!-- Window controls -->
    <text x="1012" y="66" font-size="13" fill="#8A8A8A" text-anchor="middle">─</text>
    <text x="1044" y="66" font-size="12" fill="#8A8A8A" text-anchor="middle">□</text>
    <text x="1076" y="66" font-size="13" fill="#8A8A8A" text-anchor="middle">✕</text>
    <!-- Hairline divider -->
    <line x1="60" y1="84" x2="1140" y2="84" stroke="#2C2C2C" stroke-width="1"/>
  </g>

  <!-- ================= SYSTEM MENU (open) ================= -->
  <g>
    <rect x="70" y="100" width="220" height="182" rx="10" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Restore — selected -->
    <rect x="78" y="108" width="204" height="36" rx="8" fill="#1E2A1C"/>
    <rect x="88" y="119" width="14" height="14" rx="4" fill="#C2FC8B"/>
    <text x="112" y="130" font-size="13" fill="#E8E8E8">Restore</text>
    <!-- Minimize -->
    <rect x="88" y="155" width="14" height="14" rx="4" fill="#8A8A8A"/>
    <text x="112" y="166" font-size="13" fill="#E8E8E8">Minimize</text>
    <!-- Maximize -->
    <rect x="88" y="191" width="14" height="14" rx="4" fill="#8A8A8A"/>
    <text x="112" y="202" font-size="13" fill="#E8E8E8">Maximize</text>
    <line x1="78" y1="228" x2="282" y2="228" stroke="#2C2C2C" stroke-width="1"/>
    <!-- Close -->
    <rect x="88" y="236" width="14" height="14" rx="4" fill="#E05A5A"/>
    <text x="112" y="247" font-size="13" fill="#FF6B6B">Close</text>
  </g>

  <!-- ================= DOCK RAIL ================= -->
  <g>
    <rect x="60" y="84" width="200" height="676" fill="#141414"/>
    <line x1="260" y1="84" x2="260" y2="760" stroke="#2C2C2C" stroke-width="1"/>
    <!-- Mode switcher -->
    <rect x="80" y="104" width="44" height="30" rx="8" fill="#232323"/>
    <rect x="128" y="104" width="44" height="30" rx="8" fill="#1E2A1C" stroke="#C2FC8B" stroke-width="1"/>
    <rect x="176" y="104" width="44" height="30" rx="8" fill="#232323"/>
    <!-- Logo row -->
    <text x="80" y="172" font-size="15" font-weight="bold" fill="#C2FC8B">書</text>
    <text x="104" y="172" font-size="14" font-weight="bold" fill="#E8E8E8">Kaiteyo</text>
    <text x="104" y="188" font-size="10" fill="#C2FC8B">Desktop</text>
    <!-- Nav items -->
    <rect x="76" y="216" width="168" height="34" rx="9" fill="#1E2A1C"/>
    <text x="92" y="237" font-size="13" fill="#C2FC8B">Dashboard</text>
    <rect x="76" y="254" width="168" height="34" rx="9" fill="transparent"/>
    <text x="92" y="275" font-size="13" fill="#E8E8E8">Library</text>
    <rect x="76" y="292" width="168" height="34" rx="9" fill="transparent"/>
    <text x="92" y="313" font-size="13" fill="#E8E8E8">Review</text>
    <rect x="76" y="330" width="168" height="34" rx="9" fill="transparent"/>
    <text x="92" y="351" font-size="13" fill="#E8E8E8">Dictionary</text>
    <rect x="76" y="368" width="168" height="34" rx="9" fill="transparent"/>
    <text x="92" y="389" font-size="13" fill="#E8E8E8">Settings</text>
    <!-- Bottom cluster: due count + window button -->
    <line x1="76" y1="660" x2="244" y2="660" stroke="#2C2C2C" stroke-width="1"/>
    <text x="80" y="694" font-size="15" font-weight="bold" fill="#E8E8E8">12</text>
    <text x="80" y="710" font-size="10" fill="#8A8A8A">cards due</text>
    <rect x="196" y="680" width="34" height="34" rx="9" fill="#232323" stroke="#3A3A3A" stroke-width="1"/>
    <text x="213" y="701" font-size="13" fill="#C2FC8B" text-anchor="middle">▢</text>
  </g>

  <!-- ================= LAUNCHPAD (open) ================= -->
  <g>
    <rect x="440" y="252" width="520" height="300" rx="28" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1"/>
    <text x="700" y="292" font-size="11" font-weight="500" letter-spacing="2" fill="#8A8A8A" text-anchor="middle">LAUNCHPAD</text>
    <!-- 5 tiles -->
    <g>
      <rect x="478" y="312" width="84" height="92" rx="18" fill="#232323"/>
      <rect x="498" y="330" width="44" height="44" rx="14" fill="#2C2C2C"/>
      <text x="520" y="390" font-size="11" fill="#E8E8E8" text-anchor="middle">Dashboard</text>
      <rect x="578" y="312" width="84" height="92" rx="18" fill="#232323"/>
      <rect x="598" y="330" width="44" height="44" rx="14" fill="#2C2C2C"/>
      <text x="620" y="390" font-size="11" fill="#E8E8E8" text-anchor="middle">Library</text>
      <rect x="678" y="312" width="84" height="92" rx="18" fill="#232323"/>
      <rect x="698" y="330" width="44" height="44" rx="14" fill="#1E2A1C"/>
      <text x="720" y="390" font-size="11" fill="#C2FC8B" text-anchor="middle">Review</text>
      <rect x="778" y="312" width="84" height="92" rx="18" fill="#232323"/>
      <rect x="798" y="330" width="44" height="44" rx="14" fill="#2C2C2C"/>
      <text x="820" y="390" font-size="11" fill="#E8E8E8" text-anchor="middle">Dictionary</text>
      <rect x="878" y="312" width="84" height="92" rx="18" fill="#232323"/>
      <rect x="898" y="330" width="44" height="44" rx="14" fill="#2C2C2C"/>
      <text x="920" y="390" font-size="11" fill="#E8E8E8" text-anchor="middle">Settings</text>
    </g>
    <!-- Window-control strip -->
    <line x1="472" y1="430" x2="928" y2="430" stroke="#2C2C2C" stroke-width="1"/>
    <g>
      <rect x="628" y="452" width="32" height="32" rx="9" fill="#1E2A1C" stroke="#C2FC8B" stroke-width="1"/>
      <text x="644" y="472" font-size="12" fill="#C2FC8B" text-anchor="middle">↺</text>
      <rect x="664" y="452" width="32" height="32" rx="9" fill="#232323"/>
      <text x="680" y="472" font-size="12" fill="#8A8A8A" text-anchor="middle">─</text>
      <rect x="700" y="452" width="32" height="32" rx="9" fill="#232323"/>
      <text x="716" y="472" font-size="12" fill="#8A8A8A" text-anchor="middle">□</text>
      <rect x="736" y="452" width="32" height="32" rx="9" fill="#3A1C1C"/>
      <text x="752" y="472" font-size="12" fill="#FF6B6B" text-anchor="middle">✕</text>
    </g>
  </g>

  <!-- Caption -->
  <text x="60" y="786" font-size="11" fill="#5A5A5A">Schematic mockup — replace with a real capture (see docs/screenshots/README.md).</text>
</svg>
