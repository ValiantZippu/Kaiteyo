<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C2FC8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CE85E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C2FC8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2FC8B;stop-opacity:0" />
    </linearGradient>
    <filter id="logoglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#050505" />

  <!-- Subtle ambient glow - center -->
  <circle cx="640" cy="280" r="280" fill="#C2FC8B" opacity="0.03" filter="url(#logoglow)" />

  <!-- Logo Mark -->
  <g transform="translate(520, 80) scale(1.2)">
    <!-- Main stroke -->
    <path d="M80,60 
             Q140,50 180,110 
             Q210,140 200,200 
             Q195,220 180,230"
          stroke="url(#strokeGrad)" stroke-width="22" fill="none"
          stroke-linecap="round" filter="url(#logoglow)" />

    <!-- Secondary stroke -->
    <path d="M90,140 
             Q150,110 210,155 
             Q215,160 210,170"
          stroke="#C2FC8B" stroke-width="12" fill="none"
          stroke-linecap="round" opacity="0.85" />

    <!-- Tertiary flick -->
    <path d="M180,230 
             Q195,210 200,190"
          stroke="#C2FC8B" stroke-width="7" fill="none"
          stroke-linecap="round" opacity="0.6" />

    <!-- Accent dot -->
    <circle cx="200" cy="200" r="13" fill="#FEAB57" filter="url(#softglow)" />
    <circle cx="200" cy="200" r="20" fill="none" stroke="#FEAB57" stroke-width="1" opacity="0.2" />
  </g>

  <!-- Title: KAITEYO -->
  <text x="640" y="370" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="700" 
        font-size="64" 
        fill="#F0F0F0" 
        text-anchor="middle" 
        letter-spacing="12">
    KAITEYO
  </text>

  <!-- Subtitle: 書いてよ -->
  <text x="640" y="420" 
        font-family="'MS Mincho', 'Yu Mincho', serif" 
        font-weight="400" 
        font-size="28" 
        fill="#C2FC8B" 
        text-anchor="middle" 
        letter-spacing="2">
    書いてよ
  </text>

  <!-- Tagline -->
  <text x="640" y="465" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="400" 
        font-size="20" 
        fill="#A0A0A0" 
        text-anchor="middle" 
        letter-spacing="4">
    Write. Practice. Master.
  </text>

  <!-- Description -->
  <text x="640" y="500" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="400" 
        font-size="16" 
        fill="#606060" 
        text-anchor="middle" 
        letter-spacing="1">
    An open-source Japanese mastery tool
  </text>

  <!-- Decorative gradient line -->
  <rect x="400" y="530" width="480" height="1" fill="url(#lineGrad)" />

  <!-- Footer tech stack -->
  <text x="640" y="575" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="400" 
        font-size="14" 
        fill="#404040" 
        text-anchor="middle" 
        letter-spacing="2">
    Built with Jetpack Compose · Kotlin Multiplatform
  </text>
  <text x="640" y="600" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="400" 
        font-size="13" 
        fill="#353535" 
        text-anchor="middle" 
        letter-spacing="2">
    Windows · macOS · Linux · Android · iOS
  </text>

  <!-- Subtle corner accents -->
  <rect x="40" y="40" width="60" height="2" fill="#2A2A2A" />
  <rect x="40" y="40" width="2" height="60" fill="#2A2A2A" />
  <rect x="1180" y="40" width="60" height="2" fill="#2A2A2A" />
  <rect x="1238" y="40" width="2" height="60" fill="#2A2A2A" />
  <rect x="40" y="598" width="60" height="2" fill="#2A2A2A" />
  <rect x="40" y="540" width="2" height="60" fill="#2A2A2A" />
  <rect x="1180" y="598" width="60" height="2" fill="#2A2A2A" />
  <rect x="1238" y="540" width="2" height="60" fill="#2A2A2A" />
</svg>