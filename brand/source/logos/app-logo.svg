<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C2FC8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CE85E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="113" fill="#050505" />

  <!-- Main stroke — downward sweeping calligraphic motion -->
  <path d="M160,100 
           Q280,80 360,180 
           Q400,230 380,320 
           Q370,360 340,380"
        stroke="url(#strokeGrad)" stroke-width="32" fill="none"
        stroke-linecap="round" filter="url(#glow)" />

  <!-- Secondary stroke — crossing/defining motion (brush accent) -->
  <path d="M180,240 
           Q300,190 400,260 
           Q420,275 410,290"
        stroke="#C2FC8B" stroke-width="18" fill="none"
        stroke-linecap="round" opacity="0.85" />

  <!-- Tertiary stroke — subtle upward flick -->
  <path d="M340,380 
           Q360,360 370,330"
        stroke="#C2FC8B" stroke-width="10" fill="none"
        stroke-linecap="round" opacity="0.6" />

  <!-- Accent dot — completion mark (warm orange) -->
  <circle cx="380" cy="320" r="18" fill="#FEAB57" filter="url(#glow)" />

  <!-- Subtle secondary glow dot -->
  <circle cx="380" cy="320" r="28" fill="none" stroke="#FEAB57" stroke-width="1" opacity="0.2" />
</svg>